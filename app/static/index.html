<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDY IN UNIV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5d50; --accent-soft: #e6efe9; --warn: #9a5b13; --warn-soft: #fbf1e3;
  --danger: #a33a2c; --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; }
a { color: inherit; }
button, input, select, textarea { font: inherit; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
header.top .logo { font-weight: 800; letter-spacing: -0.02em; text-decoration: none; font-size: 17px; }
header.top .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
header.top .spacer { flex: 1; }
header.top .usage { font-size: 13px; color: var(--muted); }
main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 32px 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: #c9c8c1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
a.card { text-decoration: none; display: block; transition: border-color .15s; }
a.card:hover { border-color: var(--accent); }
.card .name { font-weight: 700; font-size: 17px; margin: 8px 0 2px; }
.card .meta { color: var(--muted); font-size: 13px; }
.card.add { display: flex; align-items: center; justify-content: center; border-style: dashed; color: var(--muted); min-height: 130px; font-weight: 600; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; background: var(--accent-soft); color: var(--accent); }
.badge.sec { background: #eeeeea; color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.pill { font-size: 12px; color: var(--muted); }
.pipeline { display: flex; gap: 0; margin: 8px 0 4px; overflow-x: auto; }
.step { flex: 1; min-width: 150px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); margin-right: -1px; }
.step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.step:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.step .code { font-size: 12px; font-weight: 800; color: var(--muted); }
.step .label { font-weight: 600; }
.step .state { font-size: 12px; color: var(--muted); }
.step.ready { background: var(--accent-soft); border-color: #b9d2c4; position: relative; z-index: 1; }
.step.ready .code, .step.ready .state { color: var(--accent); }
a.step { text-decoration: none; color: inherit; cursor: pointer; transition: background .15s; }
a.step:hover { background: #f1f1ec; }
a.step.ready:hover { background: #d9e8df; }
.step.selected { box-shadow: inset 0 -3px 0 var(--accent); position: relative; z-index: 2; }
table.list { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.list td, table.list th { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.list th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafaf8; }
table.list tr:last-child td { border-bottom: none; }
table.list a.title { font-weight: 600; text-decoration: none; }
table.list a.title:hover { text-decoration: underline; }
.form { display: grid; gap: 12px; }
.form label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.form input[type=text], .form select, .form textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
.form textarea { min-height: 160px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); background: #fbfbf9; cursor: pointer; }
.drop.has { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.notice { border-radius: 8px; padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.notice.err { background: #f8e6e3; color: var(--danger); }
.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.reasons li { margin: 4px 0; }
.reasons q { color: var(--muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { display: grid; gap: 10px; }
.phase { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.phase.on { color: var(--ink); font-weight: 600; }
.phase.done { color: var(--accent); }
.phase .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.phase.done .dot { background: var(--accent); border-color: var(--accent); }

/* 노트 보기 */
.note-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; font-size: 13px; }
.toc a { display: block; text-decoration: none; color: var(--muted); padding: 3px 0; }
.toc a:hover { color: var(--ink); }
.toc a.h2 { color: var(--ink); font-weight: 600; margin-top: 8px; }
.toc a.h3 { padding-left: 12px; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px 48px; }
.note { font-size: 15.5px; line-height: 1.75; }
.note h1 { font-size: 24px; margin: 0 0 18px; }
.note h2 { font-size: 20px; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.note h3 { font-size: 16.5px; margin: 28px 0 8px; }
.note code { background: #f0efea; border-radius: 4px; padding: 0 4px; font-size: 0.85em; color: var(--muted); }
.note table { border-collapse: collapse; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; }
.note th, .note td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
.note th { background: #fafaf8; }
.note blockquote { margin: 12px 0; padding: 4px 16px; border-left: 3px solid #cfcec7; color: #3a3a37; }
.note blockquote.space { border: 1px dashed #cfcec7; border-radius: 8px; color: var(--muted); padding: 6px 14px 8px;
  background-image: repeating-linear-gradient(transparent, transparent 31px, #ecebe6 31px, #ecebe6 32px); background-position: 0 30px; }
.note blockquote.space p { margin: 0; min-height: 32px; }
.note blockquote.space.typed { background-image: none; color: var(--ink); }
.note blockquote.space .memo-label { color: var(--muted); font-weight: 700; font-size: 14px; }
.note textarea.memo-input { display: block; width: 100%; min-height: 96px; border: none; outline: none; resize: none; overflow: hidden;
  padding: 0; margin: 2px 0 0; color: var(--ink); line-height: 32px; font-size: 15px;
  background: repeating-linear-gradient(transparent, transparent 31px, #ecebe6 31px, #ecebe6 32px); background-attachment: local; }
.note blockquote.space:focus-within { border-color: var(--accent); }
.note[contenteditable="true"] { outline: none; }
.editbar { position: sticky; top: 56px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 10px; }
.editbar .btn { min-width: 34px; justify-content: center; }
.editbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
.editbar .swatch { width: 26px; height: 26px; min-width: 0; padding: 0; border-radius: 50%; }
.editbar .hint { font-size: 12px; color: var(--muted); }
.memo-status { font-size: 12px; color: var(--muted); }
.memo-status.err { color: var(--danger); }
.note blockquote.memo { border-left-color: var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 0 6px 6px 0; }
.note hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
.note .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 860px) {
  .note-layout { grid-template-columns: 1fr; }
  .toc { display: none; }
  .paper { padding: 22px 18px; }
  main { padding: 20px 16px 60px; }
}
@media print {
  header.top, .toolbar, .toc, .no-print { display: none !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .note-layout { display: block; }
  .paper { border: none; padding: 0; }
  .note h2 { break-after: avoid; } .note h3 { break-after: avoid; }
  .note blockquote.space { break-inside: avoid; }
  .note textarea.memo-input::placeholder { color: transparent; }
  .note { -webkit-print-color-adjust: exact; print-color-adjust: exact; } /* 형광펜도 인쇄 */
}
/* 유형 안내 */
.guide { border: 1px solid #b9d2c4; background: var(--accent-soft); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 10px; }
.guide .headline { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.guide .headline b { color: var(--accent); }
.guide .about { margin: 0; }
.guide .facts { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; margin: 0; }
.guide .facts dt { color: var(--muted); }
.guide .facts dd { margin: 0; }
.guide ol.flow { margin: 0; padding-left: 20px; }
.guide ol.flow li.now { font-weight: 700; color: var(--accent); }
.guide .also { font-size: 14px; color: var(--muted); }
@media (max-width: 640px) { .guide .facts { grid-template-columns: 1fr; } }
/* 평가 */
.fb { margin-top: 24px; }
.fb .q { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fb .q:last-of-type { border-bottom: 0; }
.fb .q .qt { font-weight: 600; }
.fb .q .qt small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.scale, .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.scale label, .chips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px;
  padding: 4px 12px; cursor: pointer; font-size: 14px; background: #fff; color: var(--ink); }
.scale input, .chips input { display: none; }
.scale label:has(input:checked), .chips label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
.fb textarea { min-height: 70px; }
.fb .q.missing .qt { color: var(--danger); }
.bars { display: grid; gap: 6px; font-size: 14px; }
.bars .bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; }
.bars .track { height: 10px; background: #eeeeea; border-radius: 99px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); border-radius: 99px; }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; }
/* 로그인 */
.auth { max-width: 380px; margin: 48px auto; }
.auth h1 { text-align: center; margin-bottom: 4px; }
.auth .sub { text-align: center; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.tabs button { flex: 1; border: 0; background: var(--surface); padding: 8px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
.form input[type=email], .form input[type=password] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
.fine { font-size: 12px; color: var(--muted); }
header.top .me { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
header.top .me a, header.top .me button { color: var(--muted); background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
table.list td.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 프로필 */
.avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.avatar.lg { width: 64px; height: 64px; font-size: 26px; }
.avatar.xl { width: 112px; height: 112px; font-size: 44px; }
header.top .me a.who { display: inline-flex; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); font-weight: 600; }
.profile-card { display: flex; gap: 16px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; }
.profile-card .pname { font-size: 19px; font-weight: 700; }
.profile-card .pmeta { color: var(--muted); font-size: 14px; }
.form input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
@media (max-width: 640px) { header.top .me .email { display: none; } header.top .tag { display: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/">STUDY IN UNIV</a>
  <span class="tag">테스트 버전</span>
  <span class="spacer"></span>
  <span class="me" id="me"></span>
</header>
<main id="view"></main>

<script>
const $view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE_NAMES = {A:"서술·해석형", B:"수리·계산형", C:"개념·사례 이해형", D:"코딩·실습형", E:"과제·프로젝트형"};
let pollTimer = null;
let ME = null;

class AuthError extends Error {}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (res.status === 401) throw new AuthError(body.detail || "로그인이 필요해요.");
  if (!res.ok) throw new Error(body.detail || body || res.statusText);
  return body;
}
const postJSON = (path, data) => api(path, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(data)});
const track = (type, lecture_id, course_id) => postJSON("/api/events", {type, lecture_id, course_id}).catch(() => {});

async function loadMe() {
  ME = await api("/api/me");
  renderHeader();
}

// ---------- 프로필 ----------
const GRADE_LABELS = {"1": "1학년", "2": "2학년", "3": "3학년", "4": "4학년", "5": "5학년", "6": "6학년", grad: "대학원", etc: "기타"};

function avatarHtml(p, size = "") {
  if (p.avatar_url) return `<img class="avatar ${size}" src="${esc(p.avatar_url)}" alt="">`;
  const initial = (p.display_name || ME.email || "?").trim()[0].toUpperCase();
  return `<span class="avatar ${size}">${esc(initial)}</span>`;
}

function profileSummary(p) {
  return [p.school, p.department, GRADE_LABELS[p.grade], p.age ? `${p.age}세` : ""].filter(Boolean).map(esc).join(" · ");
}

// 사진을 가운데 정사각형으로 잘라 256px JPEG로 줄인다 (용량 줄이기 + 위치 정보 등 사진 정보 제거)
async function squareJpeg(file, size = 256) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch { throw new Error("이 사진 형식은 열 수 없어요. JPG나 PNG 사진으로 올려 주세요."); }
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, size, size);
  ctx.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("사진을 바꾸지 못했어요.")), "image/jpeg", 0.88));
}

async function viewProfile() {
  const p = await api("/api/profile");
  $view.innerHTML = `
    <p><a class="btn ghost small" href="#/">← 홈으로</a></p>
    <h1>내 프로필</h1>
    <p class="sub">다른 사용자에게는 보이지 않아요. 모든 칸은 비워 둬도 돼요.</p>
    <div class="card form" style="max-width:560px">
      <div class="row" style="gap:18px">
        <span id="pAvatar">${avatarHtml(p, "xl")}</span>
        <div style="display:grid;gap:6px;justify-items:start">
          <button class="btn small" id="pPick">사진 선택</button>
          <button class="btn small ghost" id="pDel" ${p.avatar_url ? "" : "hidden"}>사진 지우기</button>
          <span class="fine">가운데를 정사각형으로 잘라 작게 저장해요</span>
          <input type="file" id="pFile" accept="image/*" hidden>
        </div>
      </div>
      <label>프로필 이름 <input type="text" id="pName" maxlength="40" value="${esc(p.display_name)}" placeholder="예: 민수"></label>
      <label>학교 <input type="text" id="pSchool" maxlength="40" value="${esc(p.school)}" placeholder="예: 한국대학교"></label>
      <label>학과 <input type="text" id="pDept" maxlength="40" value="${esc(p.department)}" placeholder="예: 국어국문학과"></label>
      <div class="row" style="gap:12px; align-items:start">
        <label style="flex:1">학년
          <select id="pGrade"><option value="">선택 안 함</option>
            ${Object.entries(GRADE_LABELS).map(([k, v]) => `<option value="${k}" ${k === p.grade ? "selected" : ""}>${v}</option>`).join("")}
          </select></label>
        <label style="flex:1">나이 <input type="number" id="pAge" min="10" max="99" value="${p.age ?? ""}" placeholder="예: 21"></label>
      </div>
      <div class="row"><button class="btn primary" id="pSave">저장하기</button><span id="pMsg"></span></div>
    </div>`;
  const msg = (text, ok) => { document.getElementById("pMsg").innerHTML = `<span class="notice ${ok ? "ok" : "err"}">${esc(text)}</span>`; };
  const applied = r => { ME.profile = r; renderHeader(); document.getElementById("pAvatar").innerHTML = avatarHtml(r, "xl");
                         document.getElementById("pDel").hidden = !r.avatar_url; };
  const file = document.getElementById("pFile");
  document.getElementById("pPick").onclick = () => file.click();
  file.onchange = async () => {
    if (!file.files[0]) return;
    try {
      const fd = new FormData();
      fd.append("file", await squareJpeg(file.files[0]), "avatar.jpg");
      applied(await api("/api/profile/avatar", {method: "PUT", body: fd}));
      msg("사진을 바꿨어요.", true);
    } catch (e) { msg(e.message); }
    file.value = "";
  };
  document.getElementById("pDel").onclick = async () => {
    try { applied(await api("/api/profile/avatar", {method: "DELETE"})); msg("사진을 지웠어요.", true); }
    catch (e) { msg(e.message); }
  };
  document.getElementById("pSave").onclick = async () => {
    const age = document.getElementById("pAge").value.trim();
    const body = {display_name: document.getElementById("pName").value, school: document.getElementById("pSchool").value,
      department: document.getElementById("pDept").value, grade: document.getElementById("pGrade").value,
      age: age ? Number(age) : null};
    try {
      applied(await api("/api/profile", {method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify(body)}));
      msg("저장했어요.", true);
    } catch (e) { msg(e.message); }
  };
}

function renderHeader() {
  const quota = ME.is_admin ? "관리자 · 생성 제한 없음" : `오늘 생성 ${ME.generations_today}/${ME.daily_limit}`;
  const p = ME.profile || {};
  document.getElementById("me").innerHTML = `

// cid 를 주면 각 단계가 그 단계 화면으로 가는 버튼이 된다
function pipelineHtml(steps, {cid = null, selected = null} = {}) {
  return `<div class="pipeline">${steps.map(s => {
    const cls = `step ${s.ready ? "ready" : ""} ${s.code === selected ? "selected" : ""}`;
    const inner = `
      <div class="code">${esc(s.code)}</div>
      <div class="label">${esc(s.name)}</div>
      <div class="state">${s.ready ? "자료 생성 가능" : "준비 중"}</div>`;
    return cid ? `<a class="${cls}" href="#/c/${cid}/s/${s.code}">${inner}</a>` : `<div class="${cls}">${inner}</div>`;
  }).join("")}</div>`;
}

function setupDrop(dropId, fileId, emptyText, onPick) {
  const drop = document.getElementById(dropId), file = document.getElementById(fileId);
  const show = () => {
    const f = file.files[0];
    drop.classList.toggle("has", !!f);
    drop.textContent = f ? `선택됨: ${f.name}` : emptyText;
    if (f && onPick) onPick(f);
  };
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("has"); };
  drop.ondragleave = () => drop.classList.toggle("has", !!file.files[0]);
  drop.ondrop = e => { e.preventDefault(); file.files = e.dataTransfer.files; show(); };
  file.onchange = show;
  return file;
}

  return `<div class="guide">

      <dt>주로 보는 시험</dt><dd>${esc(g.exam)}</dd>
      <dt>공부 흐름</dt><dd><ol class="flow">${c.pipeline.map((st, i) =>
        `<li class="${st.ready ? "now" : ""}">${esc(g.flow[i] || st.name)} <span class="pill">→ ${esc(st.code)} ${esc(st.name)}${st.ready ? " (지금 만들 수 있어요)" : " (준비 중)"}</span></li>`).join("")}</ol></dd>
      <dt>지금 받을 수 있는 자료</dt><dd>${ready.length ? esc(ready.join(", ")) + " — 강의 PDF를 올리면 만들어 드려요" : "아직 없어요 (지금은 A 서술·해석형, B 수리·계산형만 지원)"}</dd>

      `<div class="also">+ <b>${esc(t)} ${esc(sg.name)}</b> 성격도 함께 있어요. ${esc(sg.about)}</div>`).join("")}

}

    ? `<span class="badge warn" title="${esc(om.map(o => `p.${o.page} ${o.description}`).join("\n"))}">누락 점검: ${om.length}건 보충함</span>`
    : `<span class="badge">누락 점검 통과</span>`;
  $view.innerHTML = `
    <div class="toolbar">
      ${back}
      <span class="spacer"></span>
      <span class="memo-status" id="memoStatus"></span>
      ${omInfo}
      ${ME.is_admin && l.cost_usd != null ? `<span class="pill">비용 $${l.cost_usd}</span>` : ""}
      ${sourceLink}
      <button class="btn small" id="dl">마크다운 받기</button>
      <button class="btn small" id="print">인쇄 / PDF 저장</button>
      <button class="btn small primary" id="rate">${l.rating ? `내 평가 ★ ${l.rating}` : "이 자료 평가하기"}</button>
    </div>
    ${l.truncated ? `<div class="notice" style="margin-bottom:14px">출력 길이 한도에 닿아 노트 끝부분이 잘렸을 수 있어요.</div>` : ""}
    <div class="note-layout">
      <nav class="toc" id="toc"></nav>
      <div>
        <div class="editbar no-print" id="editbar">
          <button class="btn small" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
          <button class="btn small" data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
          <button class="btn small" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
          <button class="btn small" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
          <span class="sep"></span>
          <span class="hint">형광펜</span>
          ${HIGHLIGHTS.map(([c, name]) => `<button class="btn swatch" data-hl="${c}" title="${name} 형광펜" style="background:${c}"></button>`).join("")}
          <button class="btn small" data-hl="transparent" title="선택한 곳의 형광펜 지우기">형광펜 지우기</button>
          <span class="sep"></span>
          <button class="btn small" data-cmd="removeFormat" title="선택한 곳의 굵게·기울임·형광펜 등을 모두 지우기">서식 지우기</button>
          <button class="btn small" data-cmd="undo" title="되돌리기 (Ctrl+Z)">↶</button>
          <button class="btn small" data-cmd="redo" title="다시 하기 (Ctrl+Y)">↷</button>
          <span class="spacer" style="flex:1"></span>
          <span class="hint">글자를 고르고 버튼을 누르세요 · 글도 직접 고칠 수 있어요</span>
          <button class="btn small ghost" id="revert">원본으로 되돌리기</button>
        </div>
        <div class="paper" id="paper"><article class="note" id="note"></article></div>
        <div id="feedback" class="no-print"></div>
      </div>
    </div>`;
  const note = document.getElementById("note"), toc = document.getElementById("toc");
  const status = document.getElementById("memoStatus");
  renderNote(md, note, toc, edited);
  attachMemos(lid, note, memos, status);
  setupEditing({lid, cid, md, memos, note, toc, status, edited: !!edited});
  document.getElementById("dl").onclick = async () => {
    let out = mdWithMemos(md, memos);
    if (note.dataset.edited) {
      try {
        out = await editedMarkdown(note, memos);
      } catch (e) {
        if (!confirm(`${e.message}\n편집 전 원본 노트 + 필기로 받을까요?`)) return;
      }
    }
    track("note_download", lid, cid);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], {type: "text/markdown"}));
    a.download = `${l.title}.md`;
    a.click();
  };
  document.getElementById("print").onclick = () => { track("note_print", lid, cid); window.print(); };
  document.getElementById("rate").onclick = () => document.getElementById("feedback").scrollIntoView({behavior: "smooth"});
  await renderFeedback(lid, document.getElementById("feedback"));
  if (scrollToFeedback) document.getElementById("feedback").scrollIntoView();
}

// ---------- 필기 ----------
// 노트의 필기·풀이 공간 칸을 입력창으로 바꾼다. 칸 번호 = 노트에서 나오는 순서. 입력을 멈추면 칸 하나씩 서버에 저장.
const SPACE_LABEL = /^(필기|풀이 공간)$/;

function attachMemos(lid, el, memos, status) {
  const show = (text, err) => { status.textContent = text; status.classList.toggle("err", !!err); };
  el.querySelectorAll("blockquote.space").forEach((b, i) => {
    const label = b.textContent.replace(/\s+/g, " ").trim();
    b.classList.add("typed");
    b.contentEditable = "false";  // 편집 모드에서도 필기 칸 틀은 그대로 (입력창은 따로 동작)
    b.innerHTML = `<div class="memo-label">${esc(label)}</div>`;
    const ta = document.createElement("textarea");
    ta.className = "memo-input";
    ta.placeholder = "여기에 직접 적을 수 있어요";
    ta.value = memos[i] || "";
    b.appendChild(ta);
    const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    let timer = null, saved = ta.value;
    const save = async () => {
      clearTimeout(timer);
      timer = null;
      const text = ta.value;
      if (text === saved) return;
      show("필기 저장 중…");
      try {
        await api(`/api/lectures/${lid}/memos`, {method: "PUT", headers: {"content-type": "application/json"},
          body: JSON.stringify({index: i, text})});
        saved = text;
        if (text.trim()) memos[i] = text; else delete memos[i];
        show("필기 저장됨");
      } catch (e) {
        show("필기 저장 실패 — 다시 입력하면 다시 저장해요", true);
      }
    };
    ta.addEventListener("input", () => { grow(); clearTimeout(timer); timer = setTimeout(save, 800); });
    ta.addEventListener("blur", () => { if (timer) save(); });
    requestAnimationFrame(grow);
  });
}

// ---------- 노트 편집 (굵게·형광펜·글 수정) ----------
// 노트는 처음부터 편집 가능(contenteditable)하고 서식 막대가 늘 보인다. 입력을 멈추면 노트 HTML을 저장한다.
// 저장할 때 수식은 TeX(data-tex)만, 필기 칸은 이름표만 남긴다 (필기 글은 따로 저장).
const HIGHLIGHTS = [["#fff2a8", "노랑"], ["#d4f5d0", "초록"], ["#ffd6e7", "분홍"], ["#d6ebff", "파랑"]];

function noteHtmlForSave(el) {
  const c = el.cloneNode(true);
  c.removeAttribute("contenteditable");
  c.querySelectorAll(".math").forEach(s => { s.innerHTML = ""; s.removeAttribute("contenteditable"); });
  c.querySelectorAll("blockquote.space").forEach(b => {
    const label = (b.querySelector(".memo-label") || b).textContent.trim();
    b.removeAttribute("class");
    b.removeAttribute("contenteditable");
    b.innerHTML = `<p><strong>${esc(label)}</strong></p>`;
  });
  c.querySelectorAll("h2[id], h3[id]").forEach(h => h.removeAttribute("id"));
  return c.innerHTML;
}

function setupEditing({lid, cid, md, memos, note, toc, status, edited}) {
  const bar = document.getElementById("editbar");
  const show = (text, err) => { status.textContent = text; status.classList.toggle("err", !!err); };
  const mark = on => { if (on) note.dataset.edited = "1"; else delete note.dataset.edited; };
  mark(edited);
  let timer = null, tracked = false, dirty = false;

  const save = async () => {
    clearTimeout(timer);
    timer = null;
    if (!dirty) return;
    dirty = false;
    show("편집 저장 중…");
    try {
      await api(`/api/lectures/${lid}/edited`, {method: "PUT", headers: {"content-type": "application/json"},
        body: JSON.stringify({html: noteHtmlForSave(note)})});
      mark(true);
      show("편집 저장됨");
    } catch (e) {
      dirty = true;
      show("편집 저장 실패 — 계속 고치면 다시 저장해요", true);
    }
  };
  const changed = () => {
    if (!tracked) { tracked = true; track("note_edit", lid, cid); }  // 처음 고친 순간 한 번만 기록
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(save, 1500);
  };
  note.addEventListener("input", e => { if (!e.target.closest("textarea")) changed(); });
  note.addEventListener("focusout", e => { if (timer && !note.contains(e.relatedTarget)) save(); });
  note.contentEditable = "true";

  // 버튼을 눌러도 노트의 글자 선택이 풀리지 않게 mousedown 기본 동작을 막는다
  bar.querySelectorAll("[data-cmd], [data-hl]").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => {
      if (b.dataset.hl) {
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("hiliteColor", false, b.dataset.hl);
        document.execCommand("styleWithCSS", false, false);
      } else {
        document.execCommand(b.dataset.cmd);
      }
      changed();
    };
  });

  document.getElementById("revert").onclick = async () => {
    if (!confirm("굵게·형광펜·글 수정을 모두 지우고 처음 만든 노트로 되돌릴까요? (필기 칸에 쓴 글은 그대로 남아요)")) return;
    clearTimeout(timer);
    dirty = false;
    try {
      await api(`/api/lectures/${lid}/edited`, {method: "DELETE"});
    } catch (e) { show("되돌리기 실패 — 다시 시도해 주세요", true); return; }
    mark(false);
    renderNote(md, note, toc);
    attachMemos(lid, note, memos, status);
    show("원본으로 되돌렸어요");
  };
}

// 편집본 마크다운 받기: 화면의 노트(HTML)를 turndown으로 마크다운으로 바꾼다 (처음 받을 때만 불러옴).
// 수식은 TeX로, 필기 칸은 쓴 글로, 형광펜은 <mark style="background:…">, 밑줄은 <u>로.
const TURNDOWN = ["https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js",
  "https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"];

const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = src;
  s.onload = res;
  s.onerror = () => rej(new Error("편집본을 마크다운으로 바꾸는 도구를 불러오지 못했어요."));
  document.head.appendChild(s);
});

async function editedMarkdown(note, memos) {
  for (const [src, name] of [[TURNDOWN[0], "TurndownService"], [TURNDOWN[1], "turndownPluginGfm"]])
    if (!window[name]) await loadScript(src);
  // turndown은 내용이 빈 요소를 규칙 없이 지우므로, 수식·필기 칸에 글자를 남겨 둔다
  const c = note.cloneNode(true);
  c.querySelectorAll(".math").forEach(s => { s.textContent = s.dataset.tex; });
  c.querySelectorAll("blockquote.space").forEach((b, i) => {
    const q = document.createElement("blockquote");
    q.dataset.space = (b.querySelector(".memo-label") || b).textContent.trim();
    q.dataset.i = i;
    q.textContent = q.dataset.space;
    b.replaceWith(q);
  });
  const td = new TurndownService({headingStyle: "atx", bulletListMarker: "-", codeBlockStyle: "fenced", emDelimiter: "*", hr: "---"});
  td.use(turndownPluginGfm.gfm);
  // 노트 글은 원래 마크다운에서 나온 것이라 [그림], P_r, 1. 같은 글자에 \ 를 붙이지 않는다 (원본 .md와 같은 모양)
  td.escape = s => s;
  td.addRule("listItem", {  // 기본은 "-   항목" → 원본처럼 "- 항목", "1. 항목"
    filter: "li",
    replacement: (t, n) => {
      const list = n.parentNode;
      const start = Number(list.getAttribute("start") || 1);
      const prefix = list.nodeName === "OL" ? `${start + [...list.children].indexOf(n)}. ` : "- ";
      t = t.replace(/^\n+/, "").replace(/\n+$/, "\n").replace(/\n/gm, "\n" + " ".repeat(prefix.length));
      return prefix + t + (n.nextSibling && !/\n$/.test(t) ? "\n" : "");
    },
  });
  // addRule은 앞에 붙으므로 기본 규칙보다 먼저 적용된다
  td.addRule("strike", {filter: ["del", "s", "strike"], replacement: t => `~~${t}~~`});
  td.addRule("underline", {filter: ["u"], replacement: t => t.trim() ? `<u>${t}</u>` : t});
  td.addRule("highlight", {
    filter: n => n.nodeName === "SPAN" && n.style.backgroundColor && !/transparent|rgba\(0, 0, 0, 0\)/.test(n.style.backgroundColor),
    replacement: (t, n) => t.trim() ? `<mark style="background:${n.style.backgroundColor}">${t}</mark>` : t,
  });
  td.addRule("math", {
    filter: n => n.nodeName === "SPAN" && n.classList.contains("math"),
    // 원본 모양 따라: 한 줄 수식은 $$…$$, 여러 줄(aligned 등)은 $$ 다음 줄부터.
    // (편집본을 불러올 때 DOMPurify가 data-tex 앞뒤 줄바꿈을 잘라서 안쪽 줄바꿈으로 판단)
    replacement: (_, n) => {
      const tex = n.dataset.tex.trim();
      if (n.dataset.display !== "1") return `$${tex}$`;
      return tex.includes("\n") ? `\n\n$$\n${tex}\n$$\n\n` : `\n\n$$${tex}$$\n\n`;
    },
  });
  td.addRule("space", {
    filter: n => n.nodeName === "BLOCKQUOTE" && !!n.dataset.space,
    replacement: (_, n) => {
      const text = memos[n.dataset.i];
      const body = text ? text.replace(/\s+$/, "").split("\n").map(l => `> ${l}  `).join("\n")
                        : Array(3).fill(">\n> &nbsp;").join("\n");
      return `\n\n> **${n.dataset.space}**\n${body}\n\n`;
    },
  });
  return td.turndown(c.innerHTML) + "\n";
}

// 마크다운 받기: 필기 칸 순서대로 쓴 글을 끼워 넣는다 (화면의 blockquote.space 순서와 같은 기준)
function mdWithMemos(md, memos) {
  let i = -1;
  return md.replace(/(?:^>[^\n]*(?:\n|$))+/gm, block => {  // [^\n]: \r\n 줄바꿈 노트도 한 덩어리로
    const label = block.replace(/^>\s?/gm, "").replace(/\*\*|&nbsp;/g, "").replace(/\s+/g, " ").trim();
    if (!SPACE_LABEL.test(label)) return block;
    const text = memos[++i];
    if (!text) return block;
    const lines = text.replace(/\s+$/, "").split("\n").map(l => `> ${l}  `).join("\n");
    return `> **${label}**\n${lines}${block.endsWith("\n") ? "\n" : ""}`;
  });
}

// ---------- 자료 만족도 평가 ----------
async function renderFeedback(lid, box) {
  const {form, feedback: saved} = await api(`/api/lectures/${lid}/feedback`);
  const v = saved || {};
  const scale = (name, cur) => `<div class="scale">${Object.entries(form.scale).map(([n, word]) =>
    `<label><input type="radio" name="${name}" value="${n}" ${+n === cur ? "checked" : ""}>${n} ${esc(word)}</label>`).join("")}</div>`;
  const chips = (name, opts, cur, type = "checkbox") => `<div class="chips">${opts.map(([k, label]) =>
    `<label><input type="${type}" name="${name}" value="${k}" ${(Array.isArray(cur) ? cur.includes(k) : cur === k) ? "checked" : ""}>${esc(label)}</label>`).join("")}</div>`;
  const ratings = [form.overall, ...form.ratings];
  const title = done => `이 자료 평가하기 ${done ? '<span class="badge">저장됨 · 수정 가능</span>' : ""}`;
  box.innerHTML = `
    <div class="card form fb">
      <div>
        <h2 style="margin:0" id="fbTitle">${title(!!saved)}</h2>
        <p class="sub" style="margin:4px 0 0">모두 같은 기준으로 점수를 매겨서 자료 품질을 비교·개선하는 데 써요. 점수 문항은 모두 답해 주세요.</p>
      </div>
      ${ratings.map(r => `<div class="q" data-key="${r.key}">
        <div class="qt">${esc(r.question)}<small>${esc(r.label)}</small></div>
        ${scale("r_" + r.key, v["r_" + r.key])}</div>`).join("")}
      <div class="q"><div class="qt">다음 강의도 이 서비스로 자료를 만들 건가요?</div>${chips("reuse", form.reuse, v.reuse, "radio")}</div>
      <div class="q"><div class="qt">이 자료를 어떻게 썼나요?<small>여러 개 선택</small></div>${chips("usage", form.usage, v.usage || [])}</div>
      <div class="q"><div class="qt">직접 정리했을 때와 비교해 아낀 시간은?</div>${chips("time_saved", form.time_saved, v.time_saved, "radio")}</div>
      <div class="q"><div class="qt">문제가 있었나요?<small>여러 개 선택</small></div>${chips("issues", form.issues, v.issues || [])}</div>
      <div class="q"><label>문제가 있던 쪽 번호 <input type="text" id="fbPages" placeholder="예: p.6, p.12~13" value="${esc(v.issue_pages)}"></label></div>
      <div class="q"><label>가장 유용했던 점<textarea id="fbBest">${esc(v.best)}</textarea></label></div>
      <div class="q"><label>가장 아쉬웠던 점<textarea id="fbWorst">${esc(v.worst)}</textarea></label></div>
      <div class="row"><button class="btn primary" id="fbSave">${saved ? "평가 수정하기" : "평가 저장하기"}</button><span id="fbMsg"></span></div>
    </div>`;
  box.querySelector("#fbSave").onclick = async () => {
    const picked = name => [...box.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
    const body = {ratings: {}, reuse: picked("reuse")[0] || null, usage: picked("usage"),
      time_saved: picked("time_saved")[0] || null, issues: picked("issues"),
      issue_pages: box.querySelector("#fbPages").value, best: box.querySelector("#fbBest").value, worst: box.querySelector("#fbWorst").value};
    let missing = false;
    ratings.forEach(r => {
      const val = picked("r_" + r.key)[0];
      box.querySelector(`.q[data-key="${r.key}"]`).classList.toggle("missing", !val);
      if (val) body.ratings[r.key] = +val; else missing = true;
    });
    const msg = box.querySelector("#fbMsg");
    if (missing) { msg.innerHTML = `<span class="notice err">빨간 문항에 점수를 골라 주세요.</span>`; return; }
    try {
      await api(`/api/lectures/${lid}/feedback`, {method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
      msg.innerHTML = `<span class="notice ok">저장했어요. 고마워요!</span>`;
      document.getElementById("rate").textContent = `내 평가 ★ ${body.ratings.overall}`;
      box.querySelector("#fbTitle").innerHTML = title(true);
      box.querySelector("#fbSave").textContent = "평가 수정하기";
    } catch (e) {
      msg.innerHTML = `<span class="notice err">${esc(e.message)}</span>`;
    }
  };
}

function watchJob(cid, lid) {
  const phases = [["writing", "노트 작성"], ["checking", "누락 점검·보충"], ["done", "완료"]];
  const draw = j => {
    const phase = j.phase === "queued" ? "writing" : j.phase;
    const idx = phases.findIndex(p => p[0] === phase);
    $view.innerHTML = `
      <p><a class="btn ghost small" href="#/c/${cid}">← 과목으로</a></p>
      <h1>노트를 만드는 중</h1>
      <p class="sub">이 화면을 떠나거나 로그아웃해도 생성은 계속돼요. 다 되면 이 강의를 다시 열면 됩니다.</p>
      <div class="card progress">
        ${phases.map(([k, name], i) => `
          <div class="phase ${i < idx ? "done" : i === idx ? "on" : ""}">
            ${i === idx ? '<span class="spinner"></span>' : '<span class="dot"></span>'}
            ${name}${k === "writing" && j.chars ? ` <span class="pill">— ${j.chars.toLocaleString()}자 작성됨</span>` : ""}
            ${k === "writing" && phase === "writing" && !j.chars ? ` <span class="pill">— 슬라이드를 읽는 중…</span>` : ""}
          </div>`).join("")}
      </div>`;
  };
  clearInterval(pollTimer);
  const tick = async () => {
    if (!location.hash.includes(lid)) { clearInterval(pollTimer); return; }
    try {
      const j = await api(`/api/lectures/${lid}/progress`);
      if (j.status !== "running") { clearInterval(pollTimer); viewLecture(cid, lid); return; }
      draw(j);
    } catch (e) {
      clearInterval(pollTimer);
      if (e instanceof AuthError) { viewAuth(); return; }
      $view.innerHTML = `<p><a class="btn ghost small" href="#/c/${cid}">← 과목으로</a></p><div class="notice err">${esc(e.message)}</div>`;
    }
  };
  draw({phase: "writing", chars: 0});
  tick();
  pollTimer = setInterval(tick, 3000);
}

// 마크다운 + 수식: 수식을 먼저 빼 두고(marked가 \ 와 _ 를 바꾸지 않게) 렌더 후 KaTeX로 되돌린다.
// 수식은 <span class="math" data-tex>에 TeX를 남겨 두어, 편집본(edited)을 저장·불러올 때 다시 그린다.
function renderNote(md, el, toc, edited) {
  if (edited) {
    el.innerHTML = DOMPurify.sanitize(edited);
  } else {
    const math = [];
    const keep = (tex, display) => { math.push({tex, display}); return `@@MATH${math.length - 1}@@`; };
    let src = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
                .replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (_, pre, t) => pre + keep(t, false));
    // marked는 ~한 개~도 취소선으로 본다 → "7~8세기 … p.3~5"가 취소선이 됐다. 코드(`…`) 밖의 물결표 하나는 글자로.
    src = src.split(/(`+[^`]*`+)/).map((p, i) => i % 2 ? p : p.replace(/(^|[^~\\])~(?!~)/g, "$1\\~")).join("");
    el.innerHTML = DOMPurify.sanitize(marked.parse(src, {gfm: true, breaks: false})).replace(/@@MATH(\d+)@@/g,
      (_, i) => `<span class="math" data-tex="${esc(math[+i].tex)}" data-display="${math[+i].display ? 1 : 0}"></span>`);
  }
  el.querySelectorAll(".math").forEach(s => {
    try { katex.render(s.dataset.tex, s, {displayMode: s.dataset.display === "1", throwOnError: false}); }
    catch { s.textContent = s.dataset.tex; }
    s.contentEditable = "false";  // 편집 모드에서 수식이 깨지지 않게 통째로만 다룬다
  });
  el.querySelectorAll("blockquote").forEach(b => {
    const t = b.textContent.replace(/\s+/g, " ").trim();
    if (/^(필기|풀이 공간)$/.test(t)) b.classList.add("space");
    else if (t.startsWith("⚠")) b.classList.add("memo");
  });
  const heads = [...el.querySelectorAll("h2, h3")];
  heads.forEach((h, i) => h.id = `s${i}`);
  toc.innerHTML = `<div class="pill" style="margin-bottom:6px">목차</div>` +
    heads.map(h => `<a class="${h.tagName.toLowerCase()}" href="javascript:void 0" data-id="${h.id}">${esc(h.textContent.replace(/\[p\.[\d~]+\]/, "").trim())}</a>`).join("");
  toc.querySelectorAll("a").forEach(a => a.onclick = () => document.getElementById(a.dataset.id).scrollIntoView({behavior: "smooth", block: "start"}));
}

// ---------- 관리자 ----------
const EVENT_NAMES = {signup: "가입", login: "로그인", classify: "유형 판정", course_create: "과목 생성",
  lecture_upload: "강의 업로드", generate_start: "생성 시작", generate_done: "생성 완료", generate_error: "생성 오류",
  note_view: "노트 열람", note_download: "마크다운 받기", note_print: "인쇄", note_edit: "노트 편집", profile_update: "프로필 수정", feedback_submit: "자료 평가"};
const RATING_NAMES = {overall: "전체 유용성", completeness: "완전성", accuracy: "정확성", structure: "구성",
  traceability: "출처 대조", writing_space: "필기 공간", time_saving: "시간 절약", stage_specific: "단계별 문항"};
const ISSUE_NAMES = {missing: "빠진 내용", wrong: "잘못 옮김", added: "원본에 없는 내용", order: "순서·구성",
  math: "수식·표 깨짐", too_long: "너무 김", hard_to_read: "읽기 어려움", none: "문제 없음"};

function feedbackAdmin(f) {
  if (!f.total) return `<div class="card empty">아직 평가가 없어요.</div>`;
  return f.by_stage.map(s => `
    <div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between"><b>${esc(s.stage)} 자료</b>
        <span class="pill">응답 ${s.responses}개 · 다음에도 쓰겠다 ${s.reuse_yes_pct}%</span></div>
      <div class="bars" style="margin-top:10px">${Object.entries(s.averages).map(([k, v]) => `
        <div class="bar"><span>${esc(RATING_NAMES[k] || k)}</span><div class="track"><div class="fill" style="width:${v / 5 * 100}%"></div></div><span class="val">${v}</span></div>`).join("")}</div>
      <p class="pill" style="margin:10px 0 0">문제 유형: ${Object.entries(s.issues).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(ISSUE_NAMES[k] || k)} ${n}`).join(" · ") || "-"}</p>
    </div>`).join("") + `
    <table class="list"><tr><th>과목</th><th>유형</th><th class="num">평가 수</th><th class="num">전체 유용성</th></tr>
      ${f.by_course.map(c => `<tr><td>${esc(c.course)}</td><td>${esc(c.course_type)}</td><td class="num">${c.responses}</td><td class="num">${c.overall}</td></tr>`).join("")}</table>
    ${f.comments.length ? `<h2>서술 의견</h2><table class="list"><tr><th>강의</th><th>점수</th><th>유용했던 점</th><th>아쉬웠던 점</th><th>문제 쪽</th></tr>
      ${f.comments.map(c => `<tr><td>${esc(c.course)}<br><span class="pill">${esc(c.lecture)} · ${esc(c.email)}</span></td><td class="num">★${c.overall}</td>
        <td>${esc(c.best)}</td><td>${esc(c.worst)}</td><td class="pill">${esc(c.issue_pages)}</td></tr>`).join("")}</table>` : ""}`;
}
const fmtTime = s => s ? new Date(s).toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "-";

async function viewAdmin() {
  if (!ME.is_admin) { location.hash = "#/"; return; }
  const d = await api("/api/admin/overview");
  $view.innerHTML = `
    <p><a class="btn ghost small" href="#/">← 내 과목</a></p>
    <h1>관리자</h1>
    <p class="sub">사용자 ${d.users.length}명 · 노트 생성 비용 합계 $${d.total_cost_usd}</p>
    <h2>사용자</h2>
    <table class="list">
      <tr><th>이메일</th><th>가입</th><th>최근 활동</th><th class="num">과목</th><th class="num">강의</th><th class="num">노트</th><th class="num">비용</th></tr>
      ${d.users.map(u => `<tr><td>${esc(u.email)}</td><td class="pill">${fmtTime(u.created_at)}</td><td class="pill">${fmtTime(u.last_seen)}</td>
        <td class="num">${u.courses}</td><td class="num">${u.lectures}</td><td class="num">${u.notes}</td><td class="num">$${u.cost_usd.toFixed(2)}</td></tr>`).join("")}
    </table>
    <h2>자료 만족도 (평가 ${d.feedback.total}개)</h2>
    ${feedbackAdmin(d.feedback)}
    <h2>최근 사용 기록 (100개)</h2>
    <table class="list">
      <tr><th>시각</th><th>사용자</th><th>기록</th><th>내용</th></tr>
      ${d.events.map(e => `<tr><td class="pill">${fmtTime(e.created_at)}</td><td>${esc(e.email)}</td><td>${esc(EVENT_NAMES[e.type] || e.type)}</td>
        <td class="pill">${esc(Object.entries(e.data || {}).map(([k, v]) => `${k}: ${v}`).join(" · "))}</td></tr>`).join("")}
    </table>`;
}

// ---------- 라우터 ----------
async function route() {
  clearInterval(pollTimer);
  try {
    if (!ME) await loadMe();
    const parts = (location.hash.replace(/^#/, "") || "/").split("/").filter(Boolean);
    if (parts.length === 0) await viewHome();
    else if (parts[0] === "new") viewNew();
    else if (parts[0] === "profile") await viewProfile();
    else if (parts[0] === "admin") await viewAdmin();
    else if (parts[0] === "c" && parts.length === 2) await viewCourse(parts[1]);
    else if (parts[0] === "c" && parts[2] === "s") await viewCourse(parts[1], parts[3]);
    else if (parts[0] === "c" && parts[2] === "l") await viewLecture(parts[1], parts[3], parts[4] === "feedback");
    else await viewHome();
  } catch (e) {
    if (e instanceof AuthError) { ME = null; viewAuth(); return; }
    $view.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
