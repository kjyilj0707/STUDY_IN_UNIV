<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDY IN UNIV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5d50; --accent-soft: #e6efe9; --warn: #9a5b13; --warn-soft: #fbf1e3;
  --danger: #a33a2c; --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; }
a { color: inherit; }
button, input, select, textarea { font: inherit; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
header.top .logo { font-weight: 800; letter-spacing: -0.02em; text-decoration: none; font-size: 17px; }
header.top .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
header.top .spacer { flex: 1; }
header.top .usage { font-size: 13px; color: var(--muted); }
main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 32px 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: #c9c8c1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
a.card { text-decoration: none; display: block; transition: border-color .15s; }
a.card:hover { border-color: var(--accent); }
.card .name { font-weight: 700; font-size: 17px; margin: 8px 0 2px; }
.card .meta { color: var(--muted); font-size: 13px; }
.card.add { display: flex; align-items: center; justify-content: center; border-style: dashed; color: var(--muted); min-height: 130px; font-weight: 600; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; background: var(--accent-soft); color: var(--accent); }
.badge.sec { background: #eeeeea; color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.pill { font-size: 12px; color: var(--muted); }
.pipeline { display: flex; gap: 0; margin: 8px 0 4px; overflow-x: auto; }
.step { flex: 1; min-width: 150px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); margin-right: -1px; }
.step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.step:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.step .code { font-size: 12px; font-weight: 800; color: var(--muted); }
.step .label { font-weight: 600; }
.step .state { font-size: 12px; color: var(--muted); }
.step.ready { background: var(--accent-soft); border-color: #b9d2c4; position: relative; z-index: 1; }
.step.ready .code, .step.ready .state { color: var(--accent); }
table.list { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.list td, table.list th { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.list th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafaf8; }
table.list tr:last-child td { border-bottom: none; }
table.list a.title { font-weight: 600; text-decoration: none; }
table.list a.title:hover { text-decoration: underline; }
.form { display: grid; gap: 12px; }
.form label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.form input[type=text], .form select, .form textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
.form textarea { min-height: 160px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); background: #fbfbf9; cursor: pointer; }
.drop.has { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.notice { border-radius: 8px; padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.notice.err { background: #f8e6e3; color: var(--danger); }
.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.reasons li { margin: 4px 0; }
.reasons q { color: var(--muted); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { display: grid; gap: 10px; }
.phase { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.phase.on { color: var(--ink); font-weight: 600; }
.phase.done { color: var(--accent); }
.phase .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.phase.done .dot { background: var(--accent); border-color: var(--accent); }

/* 노트 보기 */
.note-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; font-size: 13px; }
.toc a { display: block; text-decoration: none; color: var(--muted); padding: 3px 0; }
.toc a:hover { color: var(--ink); }
.toc a.h2 { color: var(--ink); font-weight: 600; margin-top: 8px; }
.toc a.h3 { padding-left: 12px; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px 48px; }
.note { font-size: 15.5px; line-height: 1.75; }
.note h1 { font-size: 24px; margin: 0 0 18px; }
.note h2 { font-size: 20px; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.note h3 { font-size: 16.5px; margin: 28px 0 8px; }
.note code { background: #f0efea; border-radius: 4px; padding: 0 4px; font-size: 0.85em; color: var(--muted); }
.note table { border-collapse: collapse; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; }
.note th, .note td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
.note th { background: #fafaf8; }
.note blockquote { margin: 12px 0; padding: 4px 16px; border-left: 3px solid #cfcec7; color: #3a3a37; }
.note blockquote.space { border: 1px dashed #cfcec7; border-radius: 8px; color: var(--muted); padding: 6px 14px 8px;
  background-image: repeating-linear-gradient(transparent, transparent 31px, #ecebe6 31px, #ecebe6 32px); background-position: 0 30px; }
.note blockquote.space p { margin: 0; min-height: 32px; }
.note blockquote.memo { border-left-color: var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 0 6px 6px 0; }
.note hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
.note .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 860px) {
  .note-layout { grid-template-columns: 1fr; }
  .toc { display: none; }
  .paper { padding: 22px 18px; }
  main { padding: 20px 16px 60px; }
}
@media print {
  header.top, .toolbar, .toc, .no-print { display: none !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .note-layout { display: block; }
  .paper { border: none; padding: 0; }
  .note h2 { break-after: avoid; } .note h3 { break-after: avoid; }
  .note blockquote.space { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/">STUDY IN UNIV</a>
  <span class="tag">로컬 미리보기</span>
  <span class="spacer"></span>
  <span class="usage" id="usage"></span>
</header>
<main id="view"></main>

<script>
const $view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE_NAMES = {A:"서술·해석형", B:"수리·계산형", C:"개념·사례 이해형", D:"코딩·실습형", E:"과제·프로젝트형"};
let pollTimer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body.detail || body || res.statusText);
  return body;
}

async function refreshUsage() {
  try {
    const u = await api("/api/usage");
    document.getElementById("usage").textContent = `기록된 API 사용 ${u.count}회 · $${u.total_usd}`;
  } catch {}
}

function typeBadges(c) {
  return `<span class="badge">${esc(c.primary_type)} ${esc(TYPE_NAMES[c.primary_type])}</span> ` +
    (c.secondary_types || []).map(t => `<span class="badge sec">+${esc(t)} ${esc(TYPE_NAMES[t])}</span>`).join(" ");
}

function pipelineHtml(steps) {
  return `<div class="pipeline">${steps.map(s => `
    <div class="step ${s.ready ? "ready" : ""}">
      <div class="code">${esc(s.code)}</div>
      <div class="label">${esc(s.name)}</div>
      <div class="state">${s.ready ? "자료 생성 가능" : "준비 중"}</div>
    </div>`).join("")}</div>`;
}

// ---------- 홈 ----------
async function viewHome() {
  const courses = await api("/api/courses");
  $view.innerHTML = `
    <h1>내 과목</h1>
    <p class="sub">수업계획서로 과목 유형을 판정하고, 유형별 단계에 맞는 수업 자료를 강의 PDF로 만듭니다.</p>
    <div class="grid">
      ${courses.map(c => `
        <a class="card" href="#/c/${c.id}">
          ${typeBadges(c)}
          <div class="name">${esc(c.course_name)}</div>
          <div class="meta">${esc(c.professor)} 교수 · ${esc(c.semester)}</div>
          <div class="meta">강의 자료 ${c.lectures.length}개${c.sample ? " · 샘플" : ""}</div>
        </a>`).join("")}
      <a class="card add" href="#/new">+ 새 과목 추가</a>
    </div>`;
}

// ---------- 새 과목 ----------
function viewNew() {
  $view.innerHTML = `
    <p><a class="btn ghost small" href="#/">← 내 과목</a></p>
    <h1>새 과목 추가</h1>
    <p class="sub">수업계획서 PDF를 올리거나 내용을 붙여넣으면 과목 유형과 단계(파이프라인)를 정해 드립니다.</p>
    <div class="card form" id="newForm">
      <div class="drop" id="drop">수업계획서 PDF를 여기에 끌어다 놓거나 눌러서 선택</div>
      <input type="file" id="file" accept="application/pdf" hidden>
      <label>또는 수업계획서 내용 붙여넣기
        <textarea id="text" placeholder="과목명, 교수, 강의 목표, 주차별 계획, 평가 방법 등"></textarea>
      </label>
      <div class="row">
        <button class="btn primary" id="go">유형 판정하기</button>
        <span class="pill">판정 1회 약 $0.05~0.1</span>
      </div>
      <div id="msg"></div>
    </div>
    <div id="result"></div>`;
  const drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("has"); };
  drop.ondrop = e => { e.preventDefault(); file.files = e.dataTransfer.files; showFile(); };
  file.onchange = showFile;
  function showFile() {
    drop.classList.toggle("has", file.files.length > 0);
    drop.textContent = file.files.length ? `선택됨: ${file.files[0].name}` : "수업계획서 PDF를 여기에 끌어다 놓거나 눌러서 선택";
  }
  document.getElementById("go").onclick = async () => {
    const fd = new FormData();
    if (file.files[0]) fd.append("file", file.files[0]);
    fd.append("text", document.getElementById("text").value);
    const msg = document.getElementById("msg"), btn = document.getElementById("go");
    btn.disabled = true;
    msg.innerHTML = `<div class="row"><span class="spinner"></span> 수업계획서를 읽고 유형을 판정하는 중… (30초~1분)</div>`;
    try {
      const r = await api("/api/classify", {method: "POST", body: fd});
      msg.innerHTML = "";
      showClassification(r);
      refreshUsage();
    } catch (e) {
      msg.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
    }
    btn.disabled = false;
  };
}

function showClassification(r) {
  const c = r.result;
  const box = document.getElementById("result");
  box.innerHTML = `
    <h2>판정 결과</h2>
    <div class="card form">
      <div class="row">${typeBadges(c)} <span class="pill">비용 $${r.cost_usd}</span></div>
      <div class="row">
        <label style="flex:2">과목명<input type="text" id="cName" value="${esc(c.course_name)}"></label>
        <label style="flex:1">교수<input type="text" id="cProf" value="${esc(c.professor)}"></label>
        <label style="flex:1">학기<input type="text" id="cSem" value="${esc(c.semester)}"></label>
      </div>
      <label>주 유형 (판정이 틀리면 바꿀 수 있어요)
        <select id="cType">${Object.entries(TYPE_NAMES).map(([k, v]) =>
          `<option value="${k}" ${k === c.primary_type ? "selected" : ""}>${k} ${v}${"AB".includes(k) ? "" : " (자료 생성 준비 중)"}</option>`).join("")}</select>
      </label>
      <div><b>판정 근거</b>
        <ul class="reasons">${c.reasons.map(x => `<li><b>${esc(x.signal)}</b> — <q>${esc(x.evidence)}</q></li>`).join("")}</ul>
      </div>
      ${c.evaluation ? `<div><b>평가</b> <span class="pill">${esc(c.evaluation)}</span></div>` : ""}
      <div><b>이 과목의 단계</b>${pipelineHtml(c.pipeline)}</div>
      ${c.weeks.length ? `<details><summary>주차별 계획 ${c.weeks.length}개</summary>
        <ul class="reasons">${c.weeks.map(w => `<li>${esc(w.week)} ${esc(w.topic)}</li>`).join("")}</ul></details>` : ""}
      <div class="row"><button class="btn primary" id="create">이 과목 만들기</button></div>
    </div>`;
  document.getElementById("create").onclick = async () => {
    const body = {
      course_name: document.getElementById("cName").value, professor: document.getElementById("cProf").value,
      semester: document.getElementById("cSem").value, primary_type: document.getElementById("cType").value,
      secondary_types: c.secondary_types, evaluation: c.evaluation, reasons: c.reasons, weeks: c.weeks,
      syllabus_text: r.syllabus_text,
    };
    const course = await api("/api/courses", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
    location.hash = `#/c/${course.id}`;
  };
}

// ---------- 과목 ----------
const STATUS = {ready: "생성 전", running: "생성 중", done: "완료", error: "오류"};

async function viewCourse(cid) {
  const c = await api(`/api/courses/${cid}`);
  const stage = c.pipeline[0];
  $view.innerHTML = `
    <p><a class="btn ghost small" href="#/">← 내 과목</a></p>
    <div class="row" style="justify-content:space-between">
      <div>
        ${typeBadges(c)}
        <h1 style="margin-top:6px">${esc(c.course_name)}</h1>
        <p class="sub">${esc(c.professor)} 교수 · ${esc(c.semester)}${c.evaluation ? " · 평가 " + esc(c.evaluation) : ""}</p>
      </div>
      <button class="btn small ghost" id="delCourse">과목 삭제</button>
    </div>
    <h2>단계</h2>
    ${pipelineHtml(c.pipeline)}
    <h2>${esc(stage.code)} ${esc(stage.name)}</h2>
    ${c.lectures.length ? `
      <table class="list">
        <tr><th>강의</th><th>주차</th><th>쪽수</th><th>상태</th><th></th></tr>
        ${c.lectures.map(l => `
          <tr>
            <td><a class="title" href="#/c/${cid}/l/${l.id}">${esc(l.title)}</a>${l.sample ? ' <span class="badge sec">샘플</span>' : ""}</td>
            <td class="pill">${esc(l.week)}</td>
            <td class="pill">${l.pages}장</td>
            <td>${l.status === "done" ? '<span class="badge">완료</span>' : l.status === "error" ? '<span class="badge warn">오류</span>' : `<span class="badge sec">${STATUS[l.status]}</span>`}</td>
            <td style="text-align:right"><a class="btn small" href="#/c/${cid}/l/${l.id}">${l.status === "done" ? "열기" : "보기"}</a></td>
          </tr>`).join("")}
      </table>` : `<div class="card empty">아직 강의 자료가 없어요. 아래에서 강의 PDF를 올려 보세요.</div>`}
    ${stage.ready ? `
    <h2>강의 PDF 올리기</h2>
    <div class="card form">
      <div class="drop" id="drop">강의 PDF(PPT를 PDF로 저장한 파일)를 끌어다 놓거나 눌러서 선택</div>
      <input type="file" id="file" accept="application/pdf" hidden>
      <div class="row">
        <label style="flex:2">강의 제목<input type="text" id="lTitle" placeholder="예: 6강 사대부의 풍류와 기녀들의 삶"></label>
        <label style="flex:1">주차
          ${c.weeks && c.weeks.length
            ? `<select id="lWeek"><option value="">선택 안 함</option>${c.weeks.map(w => `<option>${esc(w.week)} "${esc(w.topic)}"</option>`).join("")}</select>`
            : `<input type="text" id="lWeek" placeholder="예: 9주차">`}
        </label>
      </div>
      <div class="row"><button class="btn primary" id="upload">올리고 예상 비용 보기</button></div>
      <div id="msg"></div>
    </div>` : `<div class="notice">${esc(TYPE_NAMES[c.primary_type])} 과목의 자료 생성은 준비 중이에요 (MVP는 A 서술·해석형, B 수리·계산형).</div>`}`;

  document.getElementById("delCourse").onclick = async () => {
    if (!confirm(`"${c.course_name}" 과목과 안의 자료를 모두 삭제할까요?`)) return;
    await api(`/api/courses/${cid}`, {method: "DELETE"});
    location.hash = "#/";
  };
  if (!stage.ready) return;
  const drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("has"); };
  drop.ondrop = e => { e.preventDefault(); file.files = e.dataTransfer.files; showFile(); };
  file.onchange = showFile;
  function showFile() {
    const f = file.files[0];
    drop.classList.toggle("has", !!f);
    drop.textContent = f ? `선택됨: ${f.name}` : "강의 PDF를 끌어다 놓거나 눌러서 선택";
    const t = document.getElementById("lTitle");
    if (f && !t.value) t.value = f.name.replace(/\.pdf$/i, "").replace(/\s*\(\d+\)$/, "");
  }
  document.getElementById("upload").onclick = async () => {
    const msg = document.getElementById("msg");
    if (!file.files[0]) { msg.innerHTML = `<div class="notice">PDF를 먼저 선택하세요.</div>`; return; }
    const fd = new FormData();
    fd.append("file", file.files[0]);
    fd.append("title", document.getElementById("lTitle").value || file.files[0].name);
    fd.append("week", document.getElementById("lWeek").value);
    msg.innerHTML = `<div class="row"><span class="spinner"></span> PDF를 확인하고 비용을 계산하는 중…</div>`;
    try {
      const l = await api(`/api/courses/${cid}/lectures`, {method: "POST", body: fd});
      location.hash = `#/c/${cid}/l/${l.id}`;
    } catch (e) {
      msg.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
    }
  };
}

// ---------- 강의 / 노트 ----------
async function viewLecture(cid, lid) {
  const c = await api(`/api/courses/${cid}`);
  const l = c.lectures.find(x => x.id === lid);
  if (!l) { $view.innerHTML = `<div class="notice err">강의를 찾을 수 없어요.</div>`; return; }
  const back = `<a class="btn ghost small" href="#/c/${cid}">← ${esc(c.course_name)}</a>`;

  if (l.status === "ready" || l.status === "error") {
    const est = l.estimate;
    $view.innerHTML = `
      <p>${back}</p>
      <h1>${esc(l.title)}</h1>
      <p class="sub">${esc(l.stage)} ${esc(c.pipeline[0].name)} · ${l.pages}장${l.week ? " · " + esc(l.week) : ""}</p>
      ${l.status === "error" ? `<div class="notice err" style="margin-bottom:14px">지난 생성이 실패했어요: ${esc(l.error)}</div>` : ""}
      <div class="card form">
        <div><b>만들어지는 자료</b><br>
          <span class="pill">슬라이드 순서 그대로, 요약·누락 없이 정리 · 슬라이드마다 [p.N] 출처 · 필기 여백 · 원본 오타는 고치지 않고 ⚠ 메모${l.stage === "B1" ? " · 수식은 LaTeX, 예제는 문제/풀이/풀이 공간" : ""}</span></div>
        <div><b>과정</b><br><span class="pill">① 노트 작성 (3~6분) → ② PDF와 다시 대조해 빠진 내용 보충 (1~2분)</span></div>
        ${est ? `<div><b>예상 비용</b> 약 $${est.low_usd} ~ $${est.high_usd} <span class="pill">(입력 ${est.input_tokens.toLocaleString()} 토큰)</span></div>` : ""}
        <div class="row">
          <button class="btn primary" id="gen">${l.status === "error" ? "다시 만들기" : "노트 만들기"}</button>
          <a class="btn" href="/api/courses/${cid}/lectures/${lid}/source" target="_blank">원본 PDF 보기</a>
          <button class="btn ghost small" id="del">이 강의 삭제</button>
        </div>
      </div>`;
    document.getElementById("gen").onclick = async () => {
      const job = await api(`/api/courses/${cid}/lectures/${lid}/generate`, {method: "POST"});
      watchJob(cid, lid, job.id);
    };
    document.getElementById("del").onclick = async () => {
      if (!confirm("이 강의를 삭제할까요?")) return;
      await api(`/api/courses/${cid}/lectures/${lid}`, {method: "DELETE"});
      location.hash = `#/c/${cid}`;
    };
    return;
  }

  if (l.status === "running") { watchJob(cid, lid, l.job); return; }

  // 완료: 노트 보기
  const md = await api(`/api/courses/${cid}/lectures/${lid}/note`);
  const om = l.omissions;
  const omInfo = l.sample ? `<span class="badge sec">샘플 (이전에 만든 노트)</span>`
    : om && om.length ? `<span class="badge warn" title="${esc(om.map(o => `p.${o.page} ${o.description}`).join("\n"))}">누락 점검: ${om.length}건 보충함</span>`
    : `<span class="badge">누락 점검 통과</span>`;
  $view.innerHTML = `
    <div class="toolbar">
      ${back}
      <span class="spacer"></span>
      ${omInfo}
      ${l.cost_usd != null ? `<span class="pill">비용 $${l.cost_usd}</span>` : ""}
      <a class="btn small" href="/api/courses/${cid}/lectures/${lid}/source" target="_blank">원본 PDF</a>
      <button class="btn small" id="dl">마크다운 받기</button>
      <button class="btn small" onclick="window.print()">인쇄 / PDF 저장</button>
    </div>
    ${l.truncated ? `<div class="notice" style="margin-bottom:14px">출력 길이 한도에 닿아 노트 끝부분이 잘렸을 수 있어요.</div>` : ""}
    <div class="note-layout">
      <nav class="toc" id="toc"></nav>
      <div class="paper"><article class="note" id="note"></article></div>
    </div>`;
  renderNote(md, document.getElementById("note"), document.getElementById("toc"));
  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([md], {type: "text/markdown"}));
    a.download = `${l.title}.md`;
    a.click();
  };
}

function watchJob(cid, lid, jid) {
  const phases = [["writing", "노트 작성"], ["checking", "누락 점검·보충"], ["done", "완료"]];
  const draw = j => {
    const idx = phases.findIndex(p => p[0] === j.phase);
    $view.innerHTML = `
      <p><a class="btn ghost small" href="#/c/${cid}">← 과목으로</a></p>
      <h1>노트를 만드는 중</h1>
      <p class="sub">이 화면을 떠나도 생성은 계속돼요. 다 되면 이 강의를 다시 열면 됩니다.</p>
      <div class="card progress">
        ${phases.map(([k, name], i) => `
          <div class="phase ${i < idx || j.phase === "done" ? "done" : i === idx ? "on" : ""}">
            ${i === idx && j.phase !== "done" ? '<span class="spinner"></span>' : '<span class="dot"></span>'}
            ${name}${k === "writing" && j.chars ? ` <span class="pill">— ${j.chars.toLocaleString()}자 작성됨</span>` : ""}
            ${k === "writing" && j.phase === "writing" && !j.chars ? ` <span class="pill">— 슬라이드를 읽는 중…</span>` : ""}
          </div>`).join("")}
      </div>`;
  };
  clearInterval(pollTimer);
  const tick = async () => {
    if (!location.hash.includes(lid)) { clearInterval(pollTimer); return; }
    try {
      const j = await api(`/api/jobs/${jid}`);
      if (j.phase === "done" || j.phase === "error") { clearInterval(pollTimer); refreshUsage(); viewLecture(cid, lid); return; }
      draw(j);
    } catch (e) {
      clearInterval(pollTimer);
      $view.innerHTML = `<p><a class="btn ghost small" href="#/c/${cid}">← 과목으로</a></p><div class="notice err">${esc(e.message)}</div>`;
    }
  };
  draw({phase: "writing", chars: 0});
  tick();
  pollTimer = setInterval(tick, 2000);
}

// 마크다운 + 수식: 수식을 먼저 빼 두고(marked가 \ 와 _ 를 바꾸지 않게) 렌더 후 KaTeX로 되돌린다.
function renderNote(md, el, toc) {
  const math = [];
  const keep = (tex, display) => { math.push({tex, display}); return `@@MATH${math.length - 1}@@`; };
  let src = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
              .replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (_, pre, t) => pre + keep(t, false));
  let html = DOMPurify.sanitize(marked.parse(src, {gfm: true, breaks: false}));
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const m = math[+i];
    try { return katex.renderToString(m.tex, {displayMode: m.display, throwOnError: false}); }
    catch { return esc(m.tex); }
  });
  el.innerHTML = html;
  el.querySelectorAll("blockquote").forEach(b => {
    const t = b.textContent.replace(/\s+/g, " ").trim();
    if (/^(필기|풀이 공간)$/.test(t)) b.classList.add("space");
    else if (t.startsWith("⚠")) b.classList.add("memo");
  });
  const heads = [...el.querySelectorAll("h2, h3")];
  heads.forEach((h, i) => h.id = `s${i}`);
  toc.innerHTML = `<div class="pill" style="margin-bottom:6px">목차</div>` +
    heads.map(h => `<a class="${h.tagName.toLowerCase()}" href="javascript:void 0" data-id="${h.id}">${esc(h.textContent.replace(/\[p\.[\d~]+\]/, "").trim())}</a>`).join("");
  toc.querySelectorAll("a").forEach(a => a.onclick = () => document.getElementById(a.dataset.id).scrollIntoView({behavior: "smooth", block: "start"}));
}

// ---------- 라우터 ----------
async function route() {
  clearInterval(pollTimer);
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean);
  try {
    if (parts.length === 0) await viewHome();
    else if (parts[0] === "new") viewNew();
    else if (parts[0] === "c" && parts.length === 2) await viewCourse(parts[1]);
    else if (parts[0] === "c" && parts[2] === "l") await viewLecture(parts[1], parts[3]);
    else await viewHome();
  } catch (e) {
    $view.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
refreshUsage();
</script>
