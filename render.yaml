# Render 배포 설정 (Blueprint). Render 대시보드 → New → Blueprint → 이 저장소 선택.
# ANTHROPIC_API_KEY, ACCESS_CODE 는 저장소에 넣지 않고 Render 화면에서 직접 입력한다 (sync: false).
services:
  - type: web
    name: study-in-univ
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PYTHONUTF8
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      # 회원가입 초대 코드 (INVITE_CODE 가 없으면 이 값을 쓴다)
      - key: ACCESS_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # 관리자 이메일 (쉼표로 여러 개). 관리자는 생성 제한 없음 + 관리자 화면
      - key: ADMIN_EMAILS
        sync: false
      - key: DAILY_LIMIT
        value: "3"
      # 과목·강의·노트는 Supabase에 저장된다. 여기는 임시 사용량 로그만 둔다.
      - key: DATA_DIR
        value: /tmp/study-in-univ
